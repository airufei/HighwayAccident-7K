# YOLO26-m DetectClassify V22 多任务模型 (检测 + 场景分类 + 事故类型)
# V22-fix(pretrain-致命): backbone/head 结构与官方 yolo26m.pt 完全对齐。
# 旧 yaml 用 A2C2f 替换官方 C3k2 且删除 SPPF/C2PSA → 预训练仅迁移 150/791,
# model.6/8 (P4/P5 语义骨干, 各 2.7M 参数) 为随机初始化, 又被 Phase 1
# freeze=list(range(10)) 永久冻结 → 检测 mAP50≈1.6%、场景头停滞 33% 的根因。
# 本文件 0-22 层与官方 yolo26m.yaml 逐层一致, 迁移应达 ~630/791。

nc: 3                # detection classes (car, person, cyclist)
nc_cls: 3            # scene classification classes (normal, pre_crash, crash)
num_causes: 9       # 16-bit cause multi-label
num_types: 7        # 10-class accident type
has_3d: false        # V22修复(架构审计 Defect6): ACCIDENT 无 3D 标签 → 关闭

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone — 与官方 yolo26m.pt 完全一致 (含 SPPF + C2PSA)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]            # 2
  - [-1, 1, Conv,  [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]            # 4
  - [-1, 1, Conv,  [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2,  [512, True]]                   # 6
  - [-1, 1, Conv,  [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2,  [1024, True]]                  # 8
  - [-1, 1, SPPF,  [1024, 5, 3, True]]            # 9
  - [-1, 2, C2PSA, [1024]]                        # 10

# Head (FPN+PAN, 与官方一致) + DetectClassify 尾层
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 11
  - [[-1, 6], 1, Concat, [1]]                     # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]]                    # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 14
  - [[-1, 4], 1, Concat, [1]]                     # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]]                    # 16

  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18 cat head P4
  - [-1, 2, C3k2, [512, True]]                    # 19

  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]        # 22 (P5/32-large)

  - [[16, 19, 22], 1, DetectClassify, [nc, nc_cls, num_causes, num_types, has_3d]]  # 23 七元组输出
