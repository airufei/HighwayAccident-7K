# YOLO26-l DetectClassify V22 多任务模型 (检测 + 场景分类 + 3D几何 + 事故类型)
# V22 Backbone: l-scale (45M 参数, 更强特征表达)
# 基于 YOLO26 架构 (A2C2f attention blocks), scale l: [1.00, 1.00, 512]

nc: 3                # detection classes (car, person, cyclist)
nc_cls: 3            # scene classification classes (normal, pre_crash, crash)
num_causes: 9       # 16-bit cause multi-label
num_types: 7        # 10-class accident type
has_3d: true         # R1-20: 启用 3D 几何回归头 (原缺失导致 has_3d 始终为 False)

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone (YOLOv12 架构, l-scale: depth_multiple=1.0, width_multiple=1.0)
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]             # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]             # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]
  - [-1, 1, Conv,  [512, 3, 2]]                    # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv,  [1024, 3, 2]]                   # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]                # 8

# Head (FPN + DetectClassify)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                      # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]]               # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                      # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]]               # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]                     # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]]               # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]                      # cat head P5
  - [-1, 2, C3k2, [1024, True]]                    # 20 (P5/32-large)

  - [[14, 17, 20], 1, DetectClassify, [nc, nc_cls, num_causes, num_types, has_3d]]  # v21 七元组输出 (含 3D)
